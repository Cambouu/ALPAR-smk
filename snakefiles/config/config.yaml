# ----------------
# Files and folders
# ----------------

input_dir: "/home/joca00004/data/ecoli_real"
output_dir: "/home/joca00004/out"
temp_dir: "/home/joca00004/temp"
gbff_file: "/home/joca00004/data/db/Escherichia_coli.gbff"
fasta_file: "/home/joca00004/data/reference/Escherichia_coli.fasta"
env_dir: ""

# Each rule supplies its own image name and version to this format string.
container_format: "docker://docker.io/cambouu/alpar-smk-{0}"

# ----------------
# Parameters
# ----------------

genus: "ecoli"
gpa_method: "cd-hit"
# Pangenome clusters are processed in this many fixed shards. Each shard is one
# multithreaded job per rule that runs its clusters in parallel.
pangenome_shards: 8
# Memory budget (MB) for combined_ml, split equally between antibiotics. The
# 1,868 x 1.12M float32 feature matrix is 8.4 GB; with split copies and XGBoost's
# DMatrix each job needs well over 64 GB (ampicillin alone used 47 GB).
ml_mem_mb: 256000
# XGBoost grid points combined_ml trains at once (threads split evenly; results
# are bit-identical to sequential fits). One fit used only 2-4 of 16 cores. Four
# fits on 744k-feature SNP tables peaked near 210 GB; the 1.12M-feature
# baseline table needs more per fit, so 2 stays within the 256 GB request.
ml_parallel_fits: 2
# Grid search one point at a time, each point trained as a full classifier and
# the best chosen by MCC on the test split. False uses GridSearchCV (CV on the
# training split), but for XGBoost it then refits with xgb.train, which loses
# the binary objective and trains 100 rounds (bug inherited from upstream ALPAR).
ml_param_grid_low_memory_mode: True
# Features written to the feature-importance file; -1 = all with importance > 0
# (upstream's --important_feature_limit -1).
ml_important_feature_limit: -1
mock: False

datasail_delta: 0.1
datasail_epsilon: 0.2
