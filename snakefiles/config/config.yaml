# ----------------
# Files and folders
# ----------------

input_dir: "/home/joca00004/data/ecoli_real"
output_dir: "/home/joca00004/out"
temp_dir: "/home/joca00004/temp"
gbff_file: "/home/joca00004/data/db/Escherichia_coli.gbff"
fasta_file: "/home/joca00004/data/reference/Escherichia_coli.fasta"
env_dir: ""

# Each rule supplies its own image name and version to this format string.
container_format: "docker://docker.io/cambouu/alpar-smk-{0}"

# ----------------
# Parameters
# ----------------

genus: "ecoli"
gpa_method: "cd-hit"
# Pangenome clusters are processed in this many fixed shards. Each shard is one
# multithreaded job per rule that runs its clusters in parallel.
pangenome_shards: 8
# Memory budget (MB) for combined_ml, split equally between antibiotics. The
# 1,868 x 1.12M float32 feature matrix is 8.4 GB; with split copies and XGBoost's
# DMatrix each job needs well over 64 GB (ampicillin alone used 47 GB).
ml_mem_mb: 256000
mock: False

# ML feature-set experiments (target: ml_feature_sets). Each set merges only the
# enabled feature tables and writes its merged tables and models under
# <output_dir>/experiments/<name>/. The full set is the baseline in feature_table/ and ml/.
feature_sets:
  snp:           {use_snp: True,  use_gpa: False, use_pangenome: False}
  gpa:           {use_snp: False, use_gpa: True,  use_pangenome: False}
  pangenome:     {use_snp: False, use_gpa: False, use_pangenome: True}
  snp_gpa:       {use_snp: True,  use_gpa: True,  use_pangenome: False}
  snp_pangenome: {use_snp: True,  use_gpa: False, use_pangenome: True}
  gpa_pangenome: {use_snp: False, use_gpa: True,  use_pangenome: True}
# XGBoost search grid for the experiments: small has 36 combinations
# (combined_ml.py); medium and large are much bigger.
ml_param_grid_size: small

datasail_delta: 0.2
datasail_epsilon: 0.2
