# ----------------
# Files and folders
# ----------------

input_dir: "/home/joca00004/data/ecoli_real"
output_dir: "/home/joca00004/out"
temp_dir: "/home/joca00004/temp"
gbff_file: "/home/joca00004/data/db/Escherichia_coli.gbff"
fasta_file: "/home/joca00004/data/reference/Escherichia_coli.fasta"
env_dir: ""

# Each rule supplies its own image name and version to this format string.
container_format: "docker://docker.io/cambouu/alpar-smk-{0}"

# ----------------
# Parameters
# ----------------

genus: "ecoli"
gpa_method: "cd-hit"
# Pangenome clusters are processed in this many fixed shards. Each shard is one
# multithreaded job per rule that runs its clusters in parallel.
pangenome_shards: 8
# Memory budget (MB) for combined_ml, split equally between antibiotics. The
# 1,868 x 1.12M float32 feature matrix is 8.4 GB; with split copies and XGBoost's
# DMatrix each job needs well over 64 GB (ampicillin alone used 47 GB).
ml_mem_mb: 256000
# XGBoost grid points combined_ml trains at once (threads split evenly; results
# are bit-identical to sequential fits). One fit used only 2-4 of 16 cores. Four
# fits on 744k-feature SNP tables peaked near 210 GB; the 1.12M-feature
# baseline table needs more per fit, so 2 stays within the 256 GB request.
ml_parallel_fits: 2
mock: False

# PanGraph experiment (snakefiles/pangraph.smk, target experiment_pangraph).
# Name of the reference in the graph; variants are named in its coordinates.
pangraph_ref_name: "MG1655"
# The strains are split into this many groups, built as subgraphs and joined by
# pangraph merge (one build of all 1,868 went over 244 GB). 16 gives about 117
# genomes per subgraph and 15 merges in 4 levels.
pangraph_groups: 16
# Keep PanGraph features carried by at least this many strains. Counted over
# all strains without labels; 1 keeps every feature, like the SNP table.
pangraph_min_carriers: 1
# Feature sets trained and compared: name -> merged families (snp, gpa, pangraph).
pangraph_feature_sets:
  snp_gpa: [snp, gpa]
  gpa_pangraph: [gpa, pangraph]
# The report gives every other set's differences against this one.
pangraph_reference_set: snp_gpa
# XGBoost grid for the experiment: small has 36 combinations (combined_ml.py).
ml_param_grid_size: small

datasail_delta: 0.2
datasail_epsilon: 0.2
